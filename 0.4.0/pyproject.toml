[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "pybind11>=2.12",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rizChartFunction*"]

[project]
name = "rizchartfunction"
version = "0.4.0"
description = "Toolkit for creating and editing Rizline charts"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
font = [
    "fontTools>=4.0",
    "shapely>=2.0",
    "numpy>=1.20",
    "Pillow>=9.0",
    "scikit-image>=0.20",
]
