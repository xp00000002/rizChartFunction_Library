[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.12",
    "cmake>=3.15",
    "ninja>=1.11",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/rizChartFunction"]
cmake.source-dir = "."
sdist.include = [
    "CMakeLists.txt",
    "cpp/**",
    "README.md",
]
sdist.exclude = [
    "benchmarks/_output/**",
    "**/__pycache__/**",
    "**/*.py[cod]",
    "**/*.pyd",
    "**/*.so",
    "**/*.dylib",
]

[project]
name = "rizchartfunction"
version = "0.4.0"
description = "Toolkit for creating and editing Rizline charts"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
font = [
    "fontTools>=4.0",
    "shapely>=2.0",
    "numpy>=1.20",
    "Pillow>=9.0",
    "scikit-image>=0.20",
]
