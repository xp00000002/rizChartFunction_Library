name: 0.4.0

on:
  workflow_dispatch:
  push:
    paths:
      - "0.4.0/**"
      - ".github/workflows/0.4.0-ci.yml"
  pull_request:
    paths:
      - "0.4.0/**"
      - ".github/workflows/0.4.0-ci.yml"

permissions:
  contents: read

jobs:
  native:
    name: native / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with native extension
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./0.4.0
      - name: Verify native import and drawing
        run: python 0.4.0/tools/smoke_test.py --expect-native

  fallback:
    name: fallback / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.13"
    env:
      RIZCHART_BUILD_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and verify pure Python wheel
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip wheel ./0.4.0 --no-deps -w wheelhouse
          python -c "from pathlib import Path; names=[p.name for p in Path('wheelhouse').glob('*.whl')]; assert names, names; assert all('py3-none-any' in name for name in names), names"
      - name: Install pure Python build
        run: |
          python -m pip install --no-index --find-links wheelhouse rizchartfunction
      - name: Verify fallback import and drawing
        run: python 0.4.0/tools/smoke_test.py --expect-fallback
