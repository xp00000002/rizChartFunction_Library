[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rizchartfunction"
version = "0.1.0"
description = "Toolkit for creating and editing Rizline charts"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["rizChartFunction"]

[project.optional-dependencies]
font = [
    "fontTools>=4.0",
    "shapely>=2.0",
    "numpy>=1.20",
    "Pillow>=9.0",
    "scikit-image>=0.20",
]
